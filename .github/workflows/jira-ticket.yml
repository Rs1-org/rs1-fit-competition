name: Implement Jira ticket

on:
  repository_dispatch:
    types: [jira_ticket]

permissions: {}

concurrency:
  group: jira-ticket-${{ github.event.client_payload.issue_key || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      issue_key: ${{ steps.jira.outputs.issue_key }}
      base_sha: ${{ steps.branch.outputs.base_sha }}
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Jira helper syntax
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('.github/scripts/jira-ticket.py').read_text(encoding='utf-8')); print('Python syntax OK')"

      - name: Fetch Jira ticket and all comments
        id: jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python .github/scripts/jira-ticket.py

      - name: Create Jira branch and prompt
        id: branch
        env:
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          set -euo pipefail
          branch="jira/${ISSUE_KEY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          cat .github/codex/jira-ticket.md "$RUNNER_TEMP/jira-context.md" > "$RUNNER_TEMP/jira-prompt.md"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies before Codex
        run: |
          dotnet restore backend/CompetitionSolution/CompetitionSolution.sln
          npm ci --prefix frontend

      - name: Implement acceptance criteria with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/jira-prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Capture changes for independent verification
        id: package
        env:
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
          CODEX_RESULT: ${{ steps.codex.outputs.final-message }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes produced; no PR will be opened." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! printf '%s\n' "$CODEX_RESULT" | tail -n 1 | grep -qx 'IMPLEMENTATION_READY'; then
            echo "::error::Codex did not confirm completed acceptance criteria and RS1 checks; no PR will be opened."
            exit 1
          fi
          if git diff --cached --name-only | grep -Eq '^(\.github/|AGENTS\.md$|CLAUDE\.md$|\.claude/commands/)'; then
            echo "::error::Protected automation/instruction files changed; no PR will be opened."
            exit 1
          fi
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/jira-change"
          git diff --cached --binary > "$RUNNER_TEMP/jira-change/change.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.changed == 'true'
        with:
          name: jira-change
          path: ${{ runner.temp }}/jira-change/change.patch
          retention-days: 1
          if-no-files-found: error

      - name: Report implementation failure
        if: failure()
        run: echo "Ticket fetch, setup, Codex or change validation failed. No branch will be pushed and no PR will be opened. See the failed step above." | tee -a "$GITHUB_STEP_SUMMARY"

  verify:
    needs: implement
    if: needs.implement.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jira-change
          path: ${{ runner.temp }}/jira-change
      - name: Apply proposed changes
        run: git apply --index "$RUNNER_TEMP/jira-change/change.patch"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend restore and Release build
        working-directory: backend/CompetitionSolution
        run: |
          dotnet restore CompetitionSolution.sln
          dotnet build CompetitionSolution.sln --configuration Release --no-restore
      - name: Backend unit and integration tests
        working-directory: backend/CompetitionSolution
        env:
          Jwt__Key: ci-only-placeholder-key-for-isolated-tests-1234567890
          Jwt__Issuer: ci-tests
          Jwt__Audience: ci-tests
        run: dotnet test Competition.Tests/Competition.Tests.csproj --configuration Release --no-build
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production
      - name: Frontend Vitest tests
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Report failed verification
        if: failure()
        run: echo "Build, test or patch verification failed. No branch will be pushed and no PR will be opened. See the failed step above." | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [implement, verify]
    if: needs.implement.outputs.changed == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jira-change
          path: ${{ runner.temp }}/jira-change
      - name: Commit and push verified changes; open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ needs.implement.outputs.issue_key }}
          BRANCH: ${{ needs.implement.outputs.branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git apply --index "$RUNNER_TEMP/jira-change/change.patch"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to publish; no PR will be opened." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: implement $ISSUE_KEY"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'Implements Jira ticket %s.\n\nValidation: .NET Release build, xUnit unit/integration tests, Angular production build and Vitest tests passed.\n\nGenerated by workflow run: %s/%s/actions/runs/%s\n\nDraft for human review; acceptance criteria and RS1 compliance require review.\n' \
            "$ISSUE_KEY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/pr-body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$BRANCH" \
            --draft --title "$ISSUE_KEY: implement Jira ticket" --body-file "$RUNNER_TEMP/pr-body.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report publication failure
        if: failure()
        run: echo "Publication failed; check the failed step for branch/PR status. No merge or approval was attempted." | tee -a "$GITHUB_STEP_SUMMARY"
