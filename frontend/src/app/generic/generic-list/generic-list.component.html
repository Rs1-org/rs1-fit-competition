<div class="list-wrapper" [ngClass]="[variant, size]" [@listStagger]="pagedItems.length + '-' + effectiveCurrentPage">
  @for (item of pagedItems; track $index) {
    <div class="list-item" (click)="onView(item)">
      <div class="item-content">
        <ng-container
          [ngTemplateOutlet]="itemTemplate"
          [ngTemplateOutletContext]="{ $implicit: item }">
        </ng-container>
      </div>

      @if (showActions) {
        <div class="item-actions">
          <button class="btn-update" (click)="$event.stopPropagation(); onUpdate(item)">
            <i class="fa-solid fa-pen"></i> Edit
          </button>
          @if (showDelete) {
            <button class="btn-delete" (click)="$event.stopPropagation(); onDelete(item)">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          }
        </div>
      }
    </div>
  } @empty {
    <div class="empty-state">The list is empty.</div>
  }

  <app-pagination
    [totalItems]="effectiveTotalItems"
    [pageSize]="pageSize"
    [currentPage]="effectiveCurrentPage"
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
