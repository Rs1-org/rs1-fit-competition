<div class="player-card-wrapper">
  <div class="player-card">
    <h2>{{ isEditMode ? 'Edit Player' : 'Add Player' }}</h2>

    <div class="form-tabs">
      <button type="button" class="form-tab" [class.active]="activeTab === 'info'" (click)="activeTab = 'info'">
        Podaci
      </button>
      <button type="button" class="form-tab" [class.active]="activeTab === 'history'" (click)="activeTab = 'history'">
        Historija
      </button>
    </div>

    <form (ngSubmit)="savePlayer()" #playerForm="ngForm">
      <ng-container *ngIf="activeTab === 'info'">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" [(ngModel)]="player.firstName" required />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" [(ngModel)]="player.lastName" required />
        </div>

        <div class="form-group">
          <label for="dateOfBirth">Date of Birth</label>
          <input type="date" id="dateOfBirth" name="dateOfBirth" [(ngModel)]="player.dateOfBirth" required />
        </div>

        <div class="form-group">
          <label for="picture">Picture</label>
          <input type="file" id="picture" name="picture" accept="image/*" (change)="onPictureSelected($event)" />
          <img *ngIf="picturePreview" [src]="picturePreview" alt="Preview slike" class="person-picture-preview" />
        </div>

        <div class="form-group">
          <label for="height">Height (m)</label>
          <input type="number" step="0.01" id="height" name="height" [(ngModel)]="player.height" required />
        </div>

        <div class="form-group">
          <label for="shirtNumber">Shirt Number</label>
          <input type="number" id="shirtNumber" name="shirtNumber" [(ngModel)]="player.shirtNumber" required />
        </div>

        <div class="form-group">
          <label for="transferValue">Transfer Value (€)</label>
          <input type="number" step="0.01" id="transferValue" name="transferValue" [(ngModel)]="player.transferValue" required />
        </div>
      </ng-container>

      <ng-container *ngIf="activeTab === 'history'">
        <div class="history-tab-content">
        <p class="history-section-title">Selekcija</p>

        <div class="form-group">
          <label for="goals">Golovi</label>
          <input type="number" id="goals" name="goals" [(ngModel)]="history.selection.goals" />
        </div>

        <div class="form-group">
          <label for="matchPlayed">Odigrane utakmice</label>
          <input type="number" id="matchPlayed" name="matchPlayed" [(ngModel)]="history.selection.matchPlayed" />
        </div>

        <div class="form-group">
          <label for="assists">Asistencije</label>
          <input type="number" id="assists" name="assists" [(ngModel)]="history.selection.assists" />
        </div>

        <div class="form-group">
          <label for="historyShirtNumber">Broj dresa (historija)</label>
          <input type="number" id="historyShirtNumber" name="historyShirtNumber" [(ngModel)]="history.selection.shirtNumber" />
        </div>

        <p class="history-section-title">Transfer</p>

        <div class="form-group">
          <label for="transferDate">Datum transfera</label>
          <input type="date" id="transferDate" name="transferDate" [(ngModel)]="history.transfer.date" />
        </div>

        <div class="form-group">
          <label for="transferHistoryValue">Vrijednost transfera (€)</label>
          <input type="number" step="0.01" id="transferHistoryValue" name="transferHistoryValue" [(ngModel)]="history.transfer.value" />
        </div>

        <p class="history-section-title">Mandat</p>

        <div class="form-group">
          <label for="startMandatDate">Početak mandata</label>
          <input type="date" id="startMandatDate" name="startMandatDate" [(ngModel)]="history.mandat.startMandatDate" />
        </div>

        <div class="form-group">
          <label for="endMandatDate">Kraj mandata</label>
          <input type="date" id="endMandatDate" name="endMandatDate" [(ngModel)]="history.mandat.endMandatDate" />
        </div>
        </div>
      </ng-container>

      <div class="button-group">
        <button type="submit" [disabled]="isPlayerInvalid">
          {{ isEditMode ? 'Update Player' : 'Save Player' }}
        </button>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
