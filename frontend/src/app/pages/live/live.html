<main class="live-page">
  <header>
    <h1>Live table</h1>
    <p>Standings update when a match score changes.</p>
  </header>
  <form class="live-filters" [formGroup]="filters" aria-label="Choose a competition">
    <label>Competition
      <select formControlName="competitionPublicId">
        <option value="">Choose a competition</option>
        @for (competition of competitions(); track competition.publicId) {
          <option [value]="competition.publicId">{{ competition.name }}</option>
        }
      </select>
    </label>
    <label>Season
      <select formControlName="seasonPublicId">
        <option value="">All seasons</option>
        @for (season of seasons(); track season.publicId) {
          <option [value]="season.publicId">{{ season.name }}@if (season.isCurrent) { (current) }</option>
        }
      </select>
    </label>
  </form>

  @if (!filters.controls.competitionPublicId.value) {
    <app-empty-state icon="trophy" title="Choose a competition" message="The table is shown for one competition and season." />
  } @else if (state().loading) {
    <app-skeleton [rows]="6" />
  } @else if (state().error) {
    <app-error-banner [message]="state().error" (retry)="retry()" />
  } @else if (!state().data?.table?.length) {
    <app-empty-state icon="trophy" title="No results yet" message="The table fills in once matches in this season have a score." />
  } @else {
    <div class="table-card">
      <app-league-table [rows]="state().data!.table" [teams]="selections()" />
    </div>
  }
</main>
