<main class="staff-page">
  <header class="staff-header">
    <h1>{{ isEditMode ? 'Edit referee' : 'Add referee' }}</h1>
  </header>
  @if (isLoading) {
    <app-skeleton [rows]="4" />
  } @else if (loadError) {
    <app-error-banner [message]="loadError" (retry)="loadReferee(editingId!)" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="saveReferee()">
      <app-section-card title="Details">
        <app-input-box label="First name" [control]="form.controls.firstName" />
        <app-input-box label="Last name" [control]="form.controls.lastName" />
        <app-input-box label="Date of birth" type="date" [control]="form.controls.dateOfBirth" />
        <div class="form-group">
          <label for="picture">Picture</label>
          <input type="file" id="picture" accept="image/*" (change)="onPictureSelected($event)" />
          <app-upload-progress [percent]="uploadProgress" />
          @if (picturePreview) { <img [src]="picturePreview" alt="Picture preview" class="person-picture-preview" /> }
        </div>
        <app-input-box label="Career start" type="date" [control]="form.controls.careerStart" />
      </app-section-card>
      <div class="button-group">
        <app-button type="submit" [text]="isEditMode ? 'Update referee' : 'Save referee'" [loading]="isSaving" [disabled]="form.invalid" />
        <app-button type="button" variant="secondary" text="Cancel" (click)="cancel()" />
      </div>
    </form>
  }
</main>
