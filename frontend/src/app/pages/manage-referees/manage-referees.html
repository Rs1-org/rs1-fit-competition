<div class="referee-card-wrapper">
  <div class="referee-card">
    <h2>{{ isEditMode ? 'Edit Referee' : 'Add Referee' }}</h2>

    <form [formGroup]="form" (ngSubmit)="saveReferee()">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" formControlName="firstName" />
        @if (fieldError('firstName'); as error) {
          <p class="field-error">{{ error }}</p>
        }
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" formControlName="lastName" />
        @if (fieldError('lastName'); as error) {
          <p class="field-error">{{ error }}</p>
        }
      </div>

      <div class="form-group">
        <label for="dateOfBirth">Date of Birth</label>
        <input type="date" id="dateOfBirth" formControlName="dateOfBirth" />
        @if (fieldError('dateOfBirth'); as error) {
          <p class="field-error">{{ error }}</p>
        }
      </div>

      <div class="form-group">
        <label for="picture">Picture</label>
        <input type="file" id="picture" accept="image/*" (change)="onPictureSelected($event)" />
        <app-upload-progress [percent]="uploadProgress"></app-upload-progress>
        @if (picturePreview) {
          <img [src]="picturePreview" alt="Picture preview" class="person-picture-preview" />
        }
      </div>

      <div class="form-group">
        <label for="careerStart">Career Start</label>
        <input type="date" id="careerStart" formControlName="careerStart" />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="form.invalid">
          {{ isEditMode ? 'Update Referee' : 'Save Referee' }}
        </button>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
