<div class="referee-card-wrapper">
  <div class="referee-card">
    <h2>{{ isEditMode ? 'Edit Referee' : 'Add Referee' }}</h2>

    <form (ngSubmit)="saveReferee()" #refereeForm="ngForm">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" [(ngModel)]="referee.firstName" required />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" [(ngModel)]="referee.lastName" required />
      </div>

      <div class="form-group">
        <label for="dateOfBirth">Date of Birth</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" [(ngModel)]="referee.dateOfBirth" required />
      </div>

      <div class="form-group">
        <label for="picture">Picture</label>
        <input type="file" id="picture" name="picture" accept="image/*" (change)="onPictureSelected($event)" />
        <app-upload-progress [percent]="uploadProgress"></app-upload-progress>
        <img *ngIf="picturePreview" [src]="picturePreview" alt="Preview slike" class="person-picture-preview" />
      </div>

      <div class="form-group">
        <label for="careerStart">Career Start</label>
        <input type="date" id="careerStart" name="careerStart" [(ngModel)]="referee.careerStart" />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isRefereeInvalid">
          {{ isEditMode ? 'Update Referee' : 'Save Referee' }}
        </button>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
