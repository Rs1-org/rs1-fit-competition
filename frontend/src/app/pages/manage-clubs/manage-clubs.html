<app-navbar></app-navbar>

<main class="club-page">
  <section class="club-panel">
    <h1>{{ editingSlug ? 'Update Club' : 'Add Club' }}</h1>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="club-form">
      <label>
        Name
        <input type="text" formControlName="name" maxlength="100" />
      </label>

      <label>
        Founding date
        <input type="date" formControlName="foundingDate" />
      </label>

      <label>
        City
        <select formControlName="cityId">
          <option value="">Select city</option>
          @for (city of cities; track city.id) {
            <option [value]="city.id">{{ city.name }}</option>
          }
        </select>
      </label>

      <label>
        Age group
        <select formControlName="clubAge">
          @for (age of clubAges; track age) {
            <option [value]="age">{{ age }}</option>
          }
        </select>
      </label>

      <label>
        Stadium
        <select formControlName="stadiumId">
          <option value="">Select stadium</option>
          @for (stadium of stadiums; track stadium.id) {
            <option [value]="stadium.id">{{ stadium.name }}</option>
          }
        </select>
      </label>

      <div class="actions">
        <button type="submit" [disabled]="form.invalid">{{ editingSlug ? 'Update' : 'Create' }}</button>
        <button type="button" class="secondary" (click)="resetForm()">Cancel</button>
      </div>
    </form>
  </section>

  <section class="club-panel">
    <h2>Clubs</h2>

    <div class="club-table">
      <div class="table-row table-head">
        <span>Name</span>
        <span>Age</span>
        <span>City</span>
        <span>Stadium</span>
        <span></span>
      </div>

      @for (club of clubs; track club.id) {
        <div class="table-row">
          <span>{{ club.name }}</span>
          <span>{{ club.clubAge }}</span>
          <span>{{ club.cityName || '-' }}</span>
          <span>{{ club.stadiumName || '-' }}</span>
          <span class="row-actions">
            <button type="button" (click)="edit(club)">Edit</button>
            <button type="button" class="danger" (click)="delete(club)">Delete</button>
          </span>
        </div>
      }
    </div>
  </section>
</main>
