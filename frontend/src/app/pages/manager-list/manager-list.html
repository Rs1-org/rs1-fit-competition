<div class="container">
  <div class="header-actions">
    <h1>Managers</h1>
    <button class="btn-add" type="button" *appHasRole="'Admin,Moderator'" (click)="add()">+ Add manager</button>
  </div>

  <form class="filter-bar" [formGroup]="filterForm">
    <app-person-autocomplete
      class="filter-field"
      label="Name"
      inputId="filter-name"
      [control]="filterForm.controls.name"
      [search]="searchManagers">
    </app-person-autocomplete>
    <div class="filter-field">
      <label for="filter-age-min">Age from</label>
      <input id="filter-age-min" type="number" min="0" formControlName="ageMin" />
    </div>
    <div class="filter-field">
      <label for="filter-age-max">Age to</label>
      <input id="filter-age-max" type="number" min="0" formControlName="ageMax" />
    </div>
    <div class="filter-field">
      <label for="filter-career-from">Career start from</label>
      <input id="filter-career-from" type="date" lang="bs-Latn" formControlName="careerStartFrom" />
    </div>
    <div class="filter-field">
      <label for="filter-career-to">Career start to</label>
      <input id="filter-career-to" type="date" lang="bs-Latn" formControlName="careerStartTo" />
    </div>
    <button type="button" class="filter-reset" (click)="resetFilters()">Reset</button>
    @if (filterForm.hasError('ageRange')) {
      <p class="filter-error">Age to must be greater than or equal to age from.</p>
    }
  </form>

  <app-generic-list
    [items]="result().items"
    [pageSize]="pageSize"
    [serverTotalItems]="result().totalCount"
    [serverCurrentPage]="result().page"
    [showActions]="canManagePersons()"
    variant="card"
    (view)="view($event)"
    (update)="edit($event)"
    (delete)="delete($event)"
    (pageChange)="onPageChange($event)"
  >
    <ng-template #itemTemplate let-manager>
      <div class="item-title">{{ manager.firstName }} {{ manager.lastName }}</div>
      <div class="item-subtitle">Date of birth: {{ (manager.dateOfBirth | appDate) || '—' }}</div>
      <div class="item-meta">Career start: {{ (manager.careerStart | appDate) || '—' }}</div>
    </ng-template>
  </app-generic-list>
</div>
