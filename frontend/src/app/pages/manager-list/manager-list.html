<div class="container">
  <div class="header-actions">
    <h1>Lista menadžera</h1>
    @if (canManagePersons()) {
      <button class="btn-add" type="button" (click)="add()">+ Dodaj menadžera</button>
    }
  </div>

  <app-generic-search placeholder="Pretraži menadžere..." (onSearch)="search($event)"></app-generic-search>

  <app-generic-list
    [items]="managers()"
    [showActions]="canManagePersons()"
    variant="card"
    (view)="view($event)"
    (update)="edit($event)"
    (delete)="delete($event)"
  >
    <ng-template #itemTemplate let-manager>
      <div class="item-title">{{ manager.firstName }} {{ manager.lastName }}</div>
      <div class="item-subtitle">Datum rođenja: {{ manager.dateOfBirth || '—' }}</div>
      <div class="item-meta">Početak karijere: {{ manager.careerStart || '—' }}</div>
    </ng-template>
  </app-generic-list>
</div>
