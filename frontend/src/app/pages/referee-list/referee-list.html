<div class="container">
  <div class="header-actions">
    <h1>Lista sudija</h1>
    @if (canManagePersons()) {
      <button class="btn-add" type="button" (click)="add()">+ Dodaj sudiju</button>
    }
  </div>

  <app-generic-search placeholder="Pretraži sudije..." (onSearch)="search($event)"></app-generic-search>

  <app-generic-list
    [items]="referees()"
    [showActions]="canManagePersons()"
    variant="card"
    (view)="view($event)"
    (update)="edit($event)"
    (delete)="delete($event)"
  >
    <ng-template #itemTemplate let-referee>
      <div class="item-title">{{ referee.firstName }} {{ referee.lastName }}</div>
      <div class="item-subtitle">Datum rođenja: {{ referee.dateOfBirth || '—' }}</div>
      <div class="item-meta">Početak karijere: {{ referee.careerStart || '—' }}</div>
    </ng-template>
  </app-generic-list>
</div>
