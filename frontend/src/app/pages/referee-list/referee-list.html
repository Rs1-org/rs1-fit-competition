<div class="container">
  <div class="header-actions">
    <h1>Referees</h1>
    @if (canManagePersons()) {
      <button class="btn-add" type="button" (click)="add()">+ Add referee</button>
    }
  </div>

  <form class="filter-bar" [formGroup]="filterForm">
    <div class="filter-field">
      <label for="filter-name">Name</label>
      <input id="filter-name" type="text" formControlName="name" />
    </div>
    <div class="filter-field">
      <label for="filter-age-min">Age from</label>
      <input id="filter-age-min" type="number" min="0" formControlName="ageMin" />
    </div>
    <div class="filter-field">
      <label for="filter-age-max">Age to</label>
      <input id="filter-age-max" type="number" min="0" formControlName="ageMax" />
    </div>
    <div class="filter-field">
      <label for="filter-career-from">Career start from</label>
      <input id="filter-career-from" type="date" formControlName="careerStartFrom" />
    </div>
    <div class="filter-field">
      <label for="filter-career-to">Career start to</label>
      <input id="filter-career-to" type="date" formControlName="careerStartTo" />
    </div>
    <button type="button" class="filter-reset" (click)="resetFilters()">Reset</button>
    @if (filterForm.hasError('ageRange')) {
      <p class="filter-error">Age to must be greater than or equal to age from.</p>
    }
  </form>

  <app-generic-list
    [items]="result().items"
    [pageSize]="pageSize"
    [serverTotalItems]="result().totalCount"
    [serverCurrentPage]="result().page"
    [showActions]="canManagePersons()"
    variant="card"
    (view)="view($event)"
    (update)="edit($event)"
    (delete)="delete($event)"
    (pageChange)="onPageChange($event)"
  >
    <ng-template #itemTemplate let-referee>
      <div class="item-title">{{ referee.firstName }} {{ referee.lastName }}</div>
      <div class="item-subtitle">Date of birth: {{ referee.dateOfBirth || '—' }}</div>
      <div class="item-meta">Career start: {{ referee.careerStart || '—' }}</div>
    </ng-template>
  </app-generic-list>
</div>
