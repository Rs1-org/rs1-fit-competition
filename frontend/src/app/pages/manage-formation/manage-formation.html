<div class="player-card-wrapper">
  <div class="player-card">
    <h2>{{ isEditMode ? 'Edit formation' : 'Add formation' }}</h2>
    <p class="loading-text" *ngIf="error">{{ error }}</p>

    <form class="formation-form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="code">Code</label>
        <input type="text" id="code" name="code" placeholder="4-3-3" [(ngModel)]="code" required />
      </div>
      <div class="form-group">
        <label for="formationMarkId">Formation mark</label>
        <select id="formationMarkId" name="formationMarkId" [(ngModel)]="formationMarkId" required>
          <option value="">Select defenders-midfielders-attackers</option>
          <option *ngFor="let mark of markOptions" [value]="mark.id">
            {{ mark.defenders }}-{{ mark.midfielders }}-{{ mark.attackers }}
          </option>
        </select>
      </div>
      <div class="button-group">
        <button type="submit" [disabled]="isInvalid">Save</button>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
