<div class="container">
    <div class="header-actions">
        <h1>Cities</h1>
        @if(user) {
            <button class="btn-add" (click)="onAdd()">+ Add City</button>
        }
    </div>

    <app-generic-search 
        placeholder="Search cities..." 
        (onSearch)="search($event)">
    </app-generic-search>

    <app-generic-list
        [items]="citiesResult()?.items ?? []"
        [pageSize]="pageSize"
        [serverTotalItems]="citiesResult()?.totalCount"
        [serverCurrentPage]="citiesResult()?.page ?? 1"
        [showActions]="!!user"
        variant="card"
        (update)="onEdit($event)"
        (delete)="onDelete($event)"
        (pageChange)="onPageChange($event)">
        
        <ng-template #itemTemplate let-city>
            <div class="city-card-content">
                <div class="city-placeholder">City</div>
                <div class="city-info">
                    <div class="item-title">{{ city.name }}</div>
                    <div class="item-subtitle">{{ city.countryName }}</div>
                    <div class="item-meta">
                        Population: {{ city.population | number }}
                        @if(city.isCapital){
                            <span class="badge-capital">Capital</span>
                        }
                    </div>
                </div>
            </div>
        </ng-template>
    </app-generic-list>
</div>

<app-city-form
    [isOpen]="isFormOpen"
    [editCity]="selectedCity"
    (saved)="onFormSaved()"
    (closed)="onFormClosed()">
</app-city-form>
