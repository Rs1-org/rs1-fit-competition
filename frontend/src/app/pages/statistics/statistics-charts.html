<main class="statistics-page">
  <form [formGroup]="filters" class="stat-header">
    <div class="stat-heading">
      <app-section-tabs label="Statistics sections" [tabs]="tabs()" />
      <h1>Season in charts</h1>
    </div>
    <div class="stat-selects">
      <label>Competition<select formControlName="competitionPublicId"><option value="">All competitions</option>
        @for (competition of competitions(); track competition.publicId) { <option [value]="competition.publicId">{{ competition.name }}</option> }
      </select></label>
      <label>Season<select formControlName="seasonPublicId">
        <option value="">All seasons</option>
        @for (season of seasons(); track season.publicId) { <option [value]="season.publicId">{{ season.name }}{{ season.isCurrent ? ' (current)' : '' }}</option> }
      </select></label>
      <app-button variant="secondary" text="Reset" (click)="reset()" />
    </div>
  </form>
  <p class="stat-hint">Only finished matches with a recorded score are counted.</p>
  @if (state().loading) { <app-skeleton [rows]="6" /> }
  @else if (state().error) { <app-error-banner [message]="state().error" (retry)="retry()" /> }
  @else if (state().data) {
    <div class="chart-grid">
      <app-chart class="chart-wide" title="Goals per round" yTitle="Goals" [subtitle]="goalsSummary()" [labels]="goals().labels" [series]="goals().series" />
      <app-chart title="Wins, draws and losses · top 10" [stacked]="true" [horizontal]="true" [labels]="results().labels" [series]="results().series" />
      <app-chart title="Average shots per match · top 10" [horizontal]="true" [labels]="shots().labels" [series]="shots().series" />
    </div>
  }
</main>
