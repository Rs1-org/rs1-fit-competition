<main class="profile">
  <button type="button" class="back" (click)="goBack()">Back to referees</button>
  <app-breadcrumb [items]="[{ label: 'Referees', route: '/referee-list' }, { label: selectedReferee ? (selectedReferee['firstName'] + ' ' + selectedReferee['lastName']) : 'Referee' }]" />

  @if (loading) {
    <app-skeleton [rows]="4" />
  } @else if (error) {
    <app-error-banner [message]="error" (retry)="retry()" />
  } @else if (selectedReferee) {
    <header class="hero">
      <button type="button" class="photo" [disabled]="!pictureUrl" (click)="zoom = true">
        @if (pictureUrl) { <img [src]="pictureUrl" alt="" /> }
        @else { <span>[PHOTO]</span> }
      </button>
      <div>
        <p class="role">Referee</p>
        <h1>{{ selectedReferee['firstName'] }} {{ selectedReferee['lastName'] }}</h1>
      </div>
    </header>
    <section class="tiles" aria-label="Referee facts">
      <app-stat-tile label="Age" [value]="age(selectedReferee['dateOfBirth']) ?? '—'" />
      <app-stat-tile label="Career start" [value]="selectedReferee['careerStart'] ? (selectedReferee['careerStart'] | appDate) : '—'" />
    </section>
    <app-image-zoom [src]="pictureUrl" [open]="zoom" (closed)="zoom = false" />
  }
</main>
