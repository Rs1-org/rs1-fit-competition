<main class="reviews-page">
  <a routerLink="/match-reviews">Back to match reviews</a>
  <h1>Match reviews</h1>
  @if (state().loading) { <p role="status">Loading match…</p> }
  @else if (state().error) { <app-error-banner [message]="state().error" (retry)="retry()" /> }
  @else if (state().data; as match) {
    <app-match-live-summary [matchPublicId]="match.publicId" />
    <a [routerLink]="['/live-matches', match.publicId]">View live timeline</a>
    <app-match-statistics-panel [matchPublicId]="match.publicId" />
    <app-match-review-panel [matchPublicId]="match.publicId" />
  }
</main>
