<main class="staff-page">
  <header class="staff-header">
    <h1>{{ isEditMode ? 'Edit manager' : 'Add manager' }}</h1>
  </header>
  <div class="form-tabs" role="tablist" aria-label="Manager form">
    <button type="button" class="form-tab" role="tab" [class.active]="activeTab === 'info'" [attr.aria-selected]="activeTab === 'info'" (click)="activeTab = 'info'">Details</button>
    <button type="button" class="form-tab" role="tab" [class.active]="activeTab === 'history'" [attr.aria-selected]="activeTab === 'history'" (click)="activeTab = 'history'">History</button>
  </div>
  @if (isLoading) {
    <app-skeleton [rows]="5" />
  } @else if (loadError) {
    <app-error-banner [message]="loadError" (retry)="loadManager(editingId!)" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="saveManager()">
      <div [@fadeSwap]="activeTab">
        @if (activeTab === 'info') {
          <app-section-card title="Details">
            <app-input-box label="First name" [control]="form.controls.firstName" />
            <app-input-box label="Last name" [control]="form.controls.lastName" />
            <app-input-box label="Date of birth" type="date" [control]="form.controls.dateOfBirth" />
            <app-file-drop [confirm]="false" [existing]="picturePreview" (chosen)="onPictureFile($event)" />
            <app-upload-progress [percent]="uploadProgress" />
            <app-input-box label="Career start" type="date" [control]="form.controls.careerStart" />
          </app-section-card>
        }
        @if (activeTab === 'history') {
          <app-section-card title="History">
            <div formGroupName="history">
              <div class="form-group">
                <label for="teamSelectionId">Selection</label>
                <select id="teamSelectionId" formControlName="teamSelectionId">
                  <option value="">—</option>
                  @for (selection of selections; track selection.id) { <option [value]="selection.id">{{ selection.name }} ({{ selection.abbreviation }})</option> }
                </select>
              </div>
              <app-input-box label="Notes" [control]="form.controls.history.controls.notes" />
              <app-input-box label="Wins" type="number" [control]="form.controls.history.controls.wins" />
              <app-input-box label="Losses" type="number" [control]="form.controls.history.controls.loses" />
              <app-input-box label="Draws" type="number" [control]="form.controls.history.controls.draw" />
              <app-input-box label="Mandate start" type="date" [control]="form.controls.history.controls.startMandatDate" />
              <app-input-box label="Mandate end" type="date" [control]="form.controls.history.controls.endMandatDate" />
            </div>
          </app-section-card>
        }
      </div>
      <div class="button-group">
        <app-button type="submit" [text]="isEditMode ? 'Update manager' : 'Save manager'" [loading]="isSaving" [disabled]="form.invalid" />
        <app-button type="button" variant="secondary" text="Cancel" (click)="cancel()" />
      </div>
    </form>
  }
</main>
