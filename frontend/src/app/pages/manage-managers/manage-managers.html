<div class="manager-card-wrapper">
  <div class="manager-card">
    <h2>{{ isEditMode ? 'Edit Manager' : 'Add Manager' }}</h2>

    <form (ngSubmit)="saveManager()" #managerForm="ngForm">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" [(ngModel)]="manager.firstName" required />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" [(ngModel)]="manager.lastName" required />
      </div>

      <div class="form-group">
        <label for="dateOfBirth">Date of Birth</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" [(ngModel)]="manager.dateOfBirth" required />
      </div>

      <div class="form-group">
        <label for="picture">Picture</label>
        <input type="file" id="picture" name="picture" accept="image/*" (change)="onPictureSelected($event)" />
      </div>

      <div class="form-group">
        <label for="careerStart">Career Start</label>
        <input type="date" id="careerStart" name="careerStart" [(ngModel)]="manager.careerStart" />
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="isManagerInvalid">
          {{ isEditMode ? 'Update Manager' : 'Save Manager' }}
        </button>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
