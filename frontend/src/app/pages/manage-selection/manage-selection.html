<div class="player-card-wrapper">
  <div class="player-card">
    <h2>{{ isEditMode ? 'Edit selection' : 'Add selection' }}</h2>
    <p class="loading-text" *ngIf="error">{{ error }}</p>

    <form class="formation-form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="name" required />
      </div>
      <div class="form-group">
        <label for="abbreviation">Abbreviation</label>
        <input type="text" id="abbreviation" name="abbreviation" maxlength="10" [(ngModel)]="abbreviation" required />
      </div>
      <div class="form-group">
        <label for="countryId">Country</label>
        <select id="countryId" name="countryId" [(ngModel)]="countryId" required>
          <option value="">Select a country</option>
          <option *ngFor="let country of countryOptions" [value]="country.id">{{ country.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="followersCount">Followers</label>
        <input type="number" id="followersCount" name="followersCount" min="0" [(ngModel)]="followersCount" />
      </div>
      <div class="button-group">
        <button type="submit" [disabled]="isInvalid">Save</button>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
