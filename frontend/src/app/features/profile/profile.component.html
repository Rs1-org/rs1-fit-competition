<main class="profile">
  <header class="hero">
    <div class="photo" aria-hidden="true">{{ initials() }}</div>
    <div>
      <p class="role">Account</p>
      <h1>{{ user()?.firstName || '—' }} {{ user()?.lastName || '' }}</h1>
    </div>
  </header>
  <section class="tiles" aria-label="Account facts">
    <app-stat-tile label="Email" [value]="user()?.email || '—'" />
    <app-stat-tile label="Phone" [value]="user()?.phoneNumber || '—'" />
    <app-stat-tile label="Role" [value]="roles().length ? roles().join(', ') : '—'" />
    <app-stat-tile label="Premium" [value]="premium() ? ('Active until ' + (user()?.premiumUntil | appDate)) : 'Not active'" />
  </section>
  <a routerLink="/settings">Edit in settings</a>
</main>
