@if(isOpen){
<app-modal [title]="isEditMode ? 'Edit Country' : 'Add Country'" (close)="onClose()">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-input-box
            label="Name"
            placeholder="Name..."
            [control]="form.controls.name"
        ></app-input-box>

        <app-input-box
            label="Picture"
            type="file"
            accept="image/*"
            (fileChange)="onFileChange($event)"
        ></app-input-box>

        <footer>
            <app-button
                type="submit"
                [text]="isEditMode ? 'Save Changes' : 'Submit'"
            ></app-button>
        </footer>
    </form>
</app-modal>
}
