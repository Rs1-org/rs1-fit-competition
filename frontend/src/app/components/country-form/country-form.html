@if (isOpen) {
<app-modal [title]="isEditMode ? 'Edit country' : 'Add country'" (close)="onClose()">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <app-input-box
            label="Name"
            placeholder="e.g. Bosnia and Herzegovina"
            [control]="form.controls.name"
        ></app-input-box>

        <app-input-box
            label="Flag picture"
            type="file"
            accept="image/*"
            (fileChange)="onFileChange($event)"
        ></app-input-box>
        <app-upload-progress [percent]="uploadProgress()"></app-upload-progress>

        @if (formError()) {
            <p class="form-error" role="alert">{{ formError() }}</p>
        }

        <footer>
            <app-button variant="secondary" text="Cancel" (click)="onClose()"></app-button>
            <app-button
                type="submit"
                [text]="isEditMode ? 'Save changes' : 'Add country'"
                [loading]="saving()"
            ></app-button>
        </footer>
    </form>
</app-modal>
}
