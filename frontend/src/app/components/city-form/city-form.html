@if (isOpen) {
<app-modal [title]="isEditMode ? 'Edit city' : 'Add city'" (close)="onClose()" width="800px">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" id="city-form" novalidate>
        <app-input-box
            label="Name"
            placeholder="e.g. Mostar"
            [control]="form.controls.name"
        ></app-input-box>

        <app-input-box
            label="Population"
            type="number"
            placeholder="e.g. 105000"
            [control]="form.controls.population"
        ></app-input-box>

        <app-dropdown
            label="Country"
            placeholder="Select a country"
            [options]="countries()"
            optionValue="publicId"
            [control]="form.controls.countryPublicId">
        </app-dropdown>

        <app-input-box
            label="Capital city"
            type="checkbox"
            [control]="form.controls.isCapital"
        ></app-input-box>

        <div class="map-field">
            <p class="map-hint">Click the map to place the city centre, or type the coordinates below.</p>
            @defer (on idle) {
                <app-map
                    [lat]="form.controls.latitude.value"
                    [lng]="form.controls.longitude.value"
                    [zoom]="isEditMode ? 10 : 6"
                    [markerLat]="pinLat()"
                    [markerLng]="pinLng()"
                    (locationSelected)="onLocationSelected($event)">
                </app-map>
            } @placeholder {
                <div class="map-placeholder"></div>
            }
        </div>

        <app-input-box
            label="Latitude"
            type="number"
            step="0.000001"
            [control]="form.controls.latitude"
            [messages]="{ min: 'Latitude goes from -90 to 90.', max: 'Latitude goes from -90 to 90.' }"
        ></app-input-box>

        <app-input-box
            label="Longitude"
            type="number"
            step="0.000001"
            [control]="form.controls.longitude"
            [messages]="{ min: 'Longitude goes from -180 to 180.', max: 'Longitude goes from -180 to 180.' }"
        ></app-input-box>

        <div class="full-width">
            <app-input-box
                label="Description"
                type="textarea"
                placeholder="A short description of the city..."
                [control]="form.controls.description"
            ></app-input-box>
        </div>

        @if (formError()) {
            <p class="form-error full-width" role="alert">{{ formError() }}</p>
        }
    </form>

    <footer>
        <app-button variant="secondary" text="Cancel" (click)="onClose()"></app-button>
        <app-button
            type="submit"
            form="city-form"
            [text]="isEditMode ? 'Save changes' : 'Add city'"
            [loading]="saving()"
        ></app-button>
    </footer>
</app-modal>
}
