<section class="stat-panel" aria-label="Match statistics"><h2>Match statistics</h2>
  @if (state().loading) { <p role="status">Loading statistics…</p> }
  @else if (state().error) { <app-error-banner [message]="state().error" (retry)="retry()" /> }
  @else {
    @if (state().data; as statistic) { <app-statistic-comparison [statistic]="statistic" /> }
    @else { <p>No team statistics have been recorded for this match.</p> }
    @if (canManage()) { <a [routerLink]="['/manage-statistics', matchPublicId]">{{ state().data ? 'Edit statistics' : 'Enter statistics' }}</a> }
  }
</section>
