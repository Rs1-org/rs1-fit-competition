@if (isOpen) {
  <app-modal [title]="isEditMode ? 'Edit subposition' : 'Add subposition'" (close)="onClose()">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-input-box label="Name" placeholder="Left back" [control]="form.controls.name"></app-input-box>
      <app-dropdown
        label="Position"
        [options]="positionOptions"
        optionLabel="name"
        optionValue="publicId"
        [control]="form.controls.positionPublicId">
      </app-dropdown>
      <footer>
        <app-button type="submit" [text]="isEditMode ? 'Save' : 'Create'"></app-button>
      </footer>
    </form>
  </app-modal>
}
