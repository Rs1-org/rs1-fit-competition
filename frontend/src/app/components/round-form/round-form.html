@if (isOpen) {
<app-modal [title]="isEditMode ? 'Edit Round' : 'Add Round'" (close)="onClose()" width="480px">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="round-form">
    <app-input-box label="Number" type="number" [control]="form.controls.number"></app-input-box>
    <app-input-box label="Name" placeholder="e.g. Round 1" [control]="form.controls.name"></app-input-box>
  </form>
  @if (errorMessage) {
    <p class="form-error" role="alert">{{ errorMessage }}</p>
  }
  <footer>
    <app-button type="submit" form="round-form" [text]="saving ? 'Saving...' : (isEditMode ? 'Save Changes' : 'Submit')"></app-button>
  </footer>
</app-modal>
}
