@if (isOpen) {
<app-modal [title]="isEditMode ? 'Edit competition' : 'Add competition'" (close)="onClose()" width="640px">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="competition-form" novalidate>
    <app-input-box label="Name" placeholder="e.g. Premijer liga BiH" [control]="form.controls.name"></app-input-box>
    <app-input-box label="Short name" placeholder="e.g. PL" [control]="form.controls.shortName"></app-input-box>
    <app-dropdown
      class="full-width"
      label="Country"
      placeholder="Select a country"
      [options]="countries()"
      optionValue="publicId"
      [control]="form.controls.countryPublicId">
    </app-dropdown>
    <app-input-box
      class="full-width"
      label="Description"
      type="textarea"
      placeholder="A few words about the competition..."
      [control]="form.controls.description">
    </app-input-box>
  </form>
  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }
  <footer>
    <app-button variant="secondary" text="Cancel" (click)="onClose()"></app-button>
    <app-button type="submit" form="competition-form" [text]="isEditMode ? 'Save changes' : 'Add competition'" [loading]="saving()"></app-button>
  </footer>
</app-modal>
}
