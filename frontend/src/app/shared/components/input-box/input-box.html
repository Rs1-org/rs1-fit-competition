<div [class.checkbox-wrapper]="type() === 'checkbox'">
  <label [attr.for]="inputId">{{ label() }}</label>

  @if (type() === 'file') {
    <input
      type="file"
      [id]="inputId"
      [accept]="accept()"
      class="input-value"
      (change)="fileChange.emit($event)"
    />
  }
  @else if (type() === 'checkbox') {
      <input
        type="checkbox"
        [id]="inputId"
        [formControl]="control()"
      />
  }
  @else if (type() === 'textarea') {
      <textarea
        [id]="inputId"
        [formControl]="control()"
        [placeholder]="placeholder()"
        [class.invalid]="showError()"
        [attr.aria-invalid]="showError() || null"
        [attr.aria-describedby]="showError() ? errorId : null"
        class="input-value textarea"
      ></textarea>
      @if (showError()) {
        <span [id]="errorId">{{ errorMessage() }}</span>
      }
  }
   @else {
    <input
      [id]="inputId"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [type]="type()"
      [attr.lang]="type() === 'date' ? 'bs-Latn' : null"
      [class.invalid]="showError()"
      [attr.aria-invalid]="showError() || null"
      [attr.aria-describedby]="showError() ? errorId : null"
      class="input-value"
      #field
    />
    @if (showError()) {
      <span [id]="errorId">{{ errorMessage() }}</span>
    }
  }
</div>
