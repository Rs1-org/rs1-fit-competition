<nav class="section-tabs" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.route) {
    <a class="section-tab" [routerLink]="tab.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
      {{ tab.label }}
      @if (tab.locked) { <app-icon name="lock" [size]="14" /> }
    </a>
  }
</nav>
