@if (svc.options(); as opts) {
  <app-modal
    [title]="opts.title ?? 'Confirm'"
    width="420px"
    (close)="svc.dismiss()">
    <p class="confirm-message">{{ opts.message }}</p>
    <div class="confirm-actions">
      <button class="btn-cancel"  (click)="svc.dismiss()">{{ opts.cancelLabel  ?? 'Cancel' }}</button>
      <button class="btn-confirm" (click)="svc.accept()">{{ opts.confirmLabel ?? 'OK' }}</button>
    </div>
  </app-modal>
}
