@if (link()) {
  <a class="tile" [routerLink]="link()" [fragment]="fragment() || undefined">
    <span class="value">{{ value() }}</span>
    <span class="label">{{ label() }}</span>
  </a>
} @else {
  <div class="tile">
    <span class="value">{{ value() }}</span>
    <span class="label">{{ label() }}</span>
  </div>
}
