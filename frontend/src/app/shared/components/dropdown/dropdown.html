<div class="dropdown-wrapper">
  <label>{{ label() }}</label>
  <div class="custom-select">
    <div class="selected" [class.open]="isOpen()" (click)="toggle()">
      {{ selectedLabel() }}
      <span class="arrow" [class.open]="isOpen()">▾</span>
    </div>
    @if(isOpen()) {
      <div class="options">
        @for(option of options(); track option[optionValue()]) {
          <div 
            class="option"
            [class.selected]="control().value === option[optionValue()]"
            (click)="selectOption(option)">
            {{ option[optionLabel()] }}
          </div>
        }
      </div>
    }
  </div>
</div>
