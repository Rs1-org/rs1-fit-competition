<div class="navbar">
  <div class="navbar-section">
    <a class="navbar-text" routerLink="/">
      <app-icon name="home"></app-icon> Home
    </a>
    <a class="navbar-text" routerLink="/live" data-tour="live">
      <span class="live-dot"></span> Live
    </a>
    <div class="navbar-text" data-tour="competitions" (click)="openCompetitions()">
      <app-icon name="trophy"></app-icon> Competitions
    </div>
    <a class="navbar-text" routerLink="/matches" data-tour="matches">Matches</a>
    <a class="navbar-text" routerLink="/clubs">Clubs</a>
    <a class="navbar-text" routerLink="/match-reviews">Match reviews</a>
    <a class="navbar-text" routerLink="/match-events">Match events</a>
    <a class="navbar-text" routerLink="/statistics" data-tour="statistics">Statistics</a>
    <div class="navbar-text" (click)="openListPlayers()">
      <app-icon name="player"></app-icon> Players
    </div>
    <div class="navbar-text" (click)="openListReferees()">
      <app-icon name="whistle"></app-icon> Referees
    </div>
    <div class="navbar-text" (click)="openListManagers()">
      <app-icon name="manager"></app-icon> Managers
    </div>
    <div class="navbar-text manage-wrapper" *ngIf="user" (click)="openManage()">
      <app-icon name="settings"></app-icon> Manage
       <div class="manage-dropdown" *ngIf="openManageTab" @popIn>
        <button *appHasRole="'Admin,Moderator'" (click)="openManagePlayers($event)">Manage Players</button>
        <button *appHasRole="'Admin,Moderator'" (click)="openManageReferees($event)">Manage Referees</button>
        <button *appHasRole="'Admin,Moderator'" (click)="openManageManagers($event)">Manage Managers</button>
        <button (click)="openCities()">Manage Cities</button>
        <button (click)="openCountries()">Manage Countries</button>
        <button (click)="openStadiums()">Manage Stadiums</button>
        <button (click)="openPositions($event)">Positions</button>
        <button (click)="openSubPositions($event)">Subpositions</button>
        <button (click)="openFormationMarks($event)">Formation marks</button>
        <button *appHasRole="'Admin,Moderator'" (click)="openAddFormationMark($event)">Add formation mark</button>
        <button (click)="openFormations($event)">Formations</button>
        <button (click)="openSelections($event)">Selections</button>
        <button *appHasRole="'Admin,Moderator'" (click)="openAddSelection($event)">Add selection</button>
        <button *appHasRole="'Admin,Moderator'" (click)="openAddFormation($event)">Add formation</button>
        <button *appHasRole="'Admin,Moderator'" (click)="openGallery($event)">Image gallery</button>
        <button type="button" *appHasRole="'Admin'" routerLink="/admin/users" (click)="$event.stopPropagation(); openManageTab = false">Users</button>
      </div>
    </div>
    <div class="navbar-end" data-tour="account">
    <div class="navbar-text manage-wrapper" (click)="toggleAccount($event)">
      <app-icon name="user"></app-icon>
      {{ user?.email || 'Guest' }}
      <div class="manage-dropdown" *ngIf="user && accountOpen" @popIn>
        <button type="button" (click)="openProfile($event)">{{ language.language() === 'en' ? 'My profile' : 'Moj profil' }}</button>
        <button type="button" (click)="openSettingsPopup($event)">Settings</button>
        <button type="button" (click)="logout($event)">{{ language.language() === 'en' ? 'Log out' : 'Odjavi se' }}</button>
      </div>
    </div>

    @if (!user) {
      <button type="button" class="nav-login" (click)="openAuth()">Log in</button>
    }
    </div>
  </div>
</div>
