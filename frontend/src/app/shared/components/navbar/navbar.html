<div class="navbar">
  <div class="navbar-section">
    <div class="navbar-text">
      <i class="fa-solid fa-house"></i> Home
    </div>
    <div class="navbar-text">
      <span class="live-dot"></span> Live
    </div>
    <div class="navbar-text">
      <i class="fa-solid fa-trophy"></i> Competitions
    </div>
    <div class="navbar-text">
      <i class="fa-solid fa-heart"></i> Favourites
    </div>
    <div class="navbar-text" (click)="openListPlayers()">
      <i class="fa-solid fa-person"></i> Players
    </div>
    <div class="navbar-text" (click)="openListReferees()">
      <i class="fa-solid fa-gavel"></i> Referees
    </div>
    <div class="navbar-text" (click)="openListManagers()">
      <i class="fa-solid fa-user-tie"></i> Managers
    </div>
    <div class="navbar-text manage-wrapper" *ngIf="user" (click)="openManage()">
      <i class="fa-solid fa-gear" ></i> Manage
       <div class="manage-dropdown" *ngIf="openManageTab">
        <button *ngIf="canManagePersons" (click)="openManagePlayers($event)">Manage Players</button>
        <button *ngIf="canManagePersons" (click)="openManageReferees($event)">Manage Referees</button>
        <button *ngIf="canManagePersons" (click)="openManageManagers($event)">Manage Managers</button>
        <button (click)="openCities()">Manage Cities</button>
        <button (click)="openCountries()">Manage Countries</button>
        <button (click)="openStadiums()">Manage Stadiums</button>
        <button (click)="openPositions($event)">Positions</button>
        <button (click)="openSubPositions($event)">Subpositions</button>
        <button (click)="openFormationMarks($event)">Formation marks</button>
        <button *ngIf="canManagePersons" (click)="openAddFormationMark($event)">Add formation mark</button>
        <button (click)="openFormations($event)">Formations</button>
        <button *ngIf="canManagePersons" (click)="openAddFormation($event)">Add formation</button>
      </div>
    </div>
    <div class="account-icon" (click)="openProfile()">
      <i class="fa-solid fa-user"></i>
      <p style="font-size: 14px;">
        {{ user?.email || 'Guest' }}
      </p>
    </div>

    @if (user) {
    <button (click)="logout()">logout</button>
    } @else {
    <button (click)="openAuth()">login</button>
    }
    <app-auth-modal></app-auth-modal>
    <app-theme-service></app-theme-service>
  </div>
</div>
