<div class="navbar">
  <div class="navbar-section">
    <div class="navbar-text">
      <i class="fa-solid fa-house"></i> Home
    </div>
    <div class="navbar-text">
      <span class="live-dot"></span> Live
    </div>
    <div class="navbar-text">
      <i class="fa-solid fa-trophy"></i> Competitions
    </div>
    <div class="navbar-text">
      <i class="fa-solid fa-heart"></i> Favourites
    </div>
    <div class="navbar-text" (click)="openListPlayers()">
      <i class="fa-solid fa-person"></i> Players
    </div>
    <div class="navbar-text manage-wrapper" (click)="openManage()">
      <i class="fa-solid fa-gear" ></i> Manage
       <div class="manage-dropdown" *ngIf="openManageTab">
        <button (click)="openManagePlayers($event)">Manage Players</button>
        <button (click)="openManageReferees($event)">Manage Referees</button>
        <button (click)="openManageManagers($event)">Manage Managers</button>
        <button (click)="openManageCountries($event)">Manage Countries</button>
        <button (click)="openManageCities($event)">Manage Cities</button>
      </div>
    </div>
    <div class="account-icon" (click)="openProfile()">
      <i class="fa-solid fa-user"></i>
      <p style="font-size: 14px;">
        {{ user?.email || 'Guest' }}
      </p>
    </div>

    @if (user) {
    <button (click)="logout()">logout</button>
    } @else {
    <button (click)="openAuth()">login</button>
    }
    <app-auth-modal></app-auth-modal>
    <app-theme-service></app-theme-service>
  </div>
</div>
