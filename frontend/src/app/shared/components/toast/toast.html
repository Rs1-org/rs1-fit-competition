<div class="toast-stack" aria-live="polite">
  @for (toast of svc.toasts(); track toast.id) {
    <div class="toast" [class.toast-error]="toast.kind === 'error'" [attr.role]="toast.kind === 'error' ? 'alert' : 'status'">
      @if (toast.kind === 'success') {
        <app-icon class="toast-icon" name="check" />
      }
      <span class="toast-message">{{ toast.message }}</span>
      <button class="toast-close" type="button" aria-label="Dismiss" (click)="svc.dismiss(toast.id)">
        <app-icon name="x" [size]="16" />
      </button>
    </div>
  }
</div>
